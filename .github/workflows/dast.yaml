name: DAST Scan with OWASP ZAP

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t dast-app .

      - name: Start application container
        run: |
          docker run -d --name dast-app -p 3000:3000 dast-app
          sleep 15  # Wait for app to start

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check running containers
        run: docker ps -a
  
      - name: Wait for app to be ready
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "App is up!"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 3
          done
          echo "App did not start in time"
          docker logs dast-app
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: ''
          cmd_options: '-t 120'
          allow_fail: true
          report_file: 'zap-report.html'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Stop application container
        if: always()
        run: docker stop dast-app && docker rm dast-app 